name: Update Currency Rates

on:
  schedule:
    - cron: '0 * * * *'   # runs every hour
  workflow_dispatch:          # allows manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest rates (160+ currencies)
        run: |
          curl -s "https://api.exchangerate-api.com/v4/latest/USD" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          out = {
              'base': d['base'],
              'date': d['date'],
              'rates': d['rates']
          }
          print(json.dumps(out, indent=2))
          " > rates.json

      - name: Verify file is valid (fail fast if API returned garbage)
        run: |
          python3 -c "
          import json, sys
          with open('rates.json') as f:
              d = json.load(f)
          assert 'rates' in d and len(d['rates']) > 100, 'rates.json looks invalid'
          print(f'OK — {len(d[\"rates\"])} currencies, date: {d[\"date\"]}')
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet && echo "No changes, skipping commit" && exit 0
          git commit -m "chore: update rates $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git push
